<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Inteligente</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e24; color: #fff; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #f4f4f9; margin-bottom: 25px; }
        
        .seccion-filtros { background: #2a2a35; padding: 15px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .titulo-filtro { font-size: 14px; color: #aaa; margin: 5px 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
        .filtros { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .filtros:last-child { margin-bottom: 0; }
        
        .btn { padding: 8px 18px; border: none; background: #3a3a4a; color: white; cursor: pointer; border-radius: 20px; font-size: 14px; transition: all 0.3s ease; }
        .btn:hover { background: #4a4a5a; transform: scale(1.02); }
        .btn.activo { background: #007bff; font-weight: bold; }
        
        .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; padding: 20px; }
        .tarjeta { background: #2a2a35; padding: 15px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); transition: transform 0.2s; position: relative; }
        .tarjeta:hover { transform: translateY(-5px); }
        .tarjeta img, .tarjeta video { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; }
        .tarjeta h3 { margin: 12px 0 5px 0; font-size: 17px; color: #fff; text-align: left; }
        .etiqueta { display: inline-block; background: #28a745; color: white; font-size: 11px; padding: 3px 8px; border-radius: 10px; margin-top: 5px; float: left; }
    </style>
</head>
<body>

    <h1>Eventos Quintos del 86 Corella 📸🎬</h1>
    
    <!-- Panel de doble filtrado -->
    <div class="seccion-filtros">
        <div class="titulo-filtro">Filtrar por Evento o Fecha</div>
        <div class="filtros" id="contenedor-eventos"></div>
        
        <div style="border-top: 1px solid #3a3a4a; margin: 10px 0;"></div>
        
        <div class="titulo-filtro">Mostrar tipo de archivo</div>
        <div class="filtros" id="contenedor-tipos">
            <button class="btn activo" onclick="cambiarTipo('todos', this)">📁 Mostrar Todo</button>
            <button class="btn" onclick="cambiarTipo('foto', this)">📸 Solo Fotos</button>
            <button class="btn" onclick="cambiarTipo('video', this)">🎬 Solo Videos</button>
        </div>
    </div>

    <!-- Contenedor de las fotos/videos -->
    <div class="galeria" id="galeria-multimedia"></div>

    <script src="script.js"></script>
</body>
</html>
